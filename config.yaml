# Training Configuration
training:
  # Model parameters
  model: "yolov8n-obb.pt"  # YOLOv8-OBB pretrained weights

  # Data parameters
  data: "./dataset/data.yaml"
  epochs: 1
  imgsz: 416
  device: 'cuda:0'

  # Optimization parameters
  batch: -1  # automatically detect
  workers: 8
  patience: 100
  optimizer: 'auto'
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 0.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Model parameters
  dropout: 0.0
  val: true
  save: true
  save_period: -1
  project: 'runs'
  name: 'yolov8n_obb_train'
  pretrained: true
  freeze: null
  cache: false
  single_cls: false
  rect: false
  cos_lr: true
  close_mosaic: 10
  resume: false
  amp: true
  fraction: 1.0
  seed: 66
  deterministic: true
  exist_ok: false

# Testing Configuration
testing:
  # Data parameters
  data: "./dataset/data.yaml"
  imgsz: 416
  device: 'cuda:0'   # cpu for CPU, cuda:0 for GPU

  # Model parameters (updated after training)
  model_path: "./runs/yolov8n_obb_train/weights/best.pt"

  # Testing parameters
  batch: 32
  workers: 8
  project: 'runs'
  name: 'yolov8n_obb_test'
  save_txt: true
  save_conf: true
  save_json: true
  conf: 0.001
  iou: 0.6
  max_det: 300
  half: true
  dnn: false
  plots: true
  classes: null
  agnostic_nms: false
  verbose: true
  split: "test"

# Cross-Validation Configuration
cross_validation:
  model: "yolov8n-obb.pt"
  dataset_path: "./dataset"
  data_yaml_path: "./dataset/data.yaml"
  k_splits: 10
  random_state: 42
  epochs: 1
  patience: 150
  batch: -1
  imgsz: 416
  save: true
  save_period: -1
  cache: false
  device: '0'
  workers: 8
  exist_ok: false
  pretrained: true
  optimizer: auto
  verbose: true
  seed: 66
  deterministic: true
  single_cls: false
  rect: false
  cos_lr: true
  close_mosaic: 10
  resume: false
  amp: true
  fraction: 1.0
  profile: false
  freeze: null
  multi_scale: false
  overlap_mask: true
  mask_ratio: 4
  dropout: 0.0
  conf: null
  iou: 0.7
  max_det: 300
  half: false
  dnn: false
  plots: true
  source: null
  vid_stride: 1
  stream_buffer: false
  visualize: false
  augment: false
  agnostic_nms: false
  classes: null
  retina_masks: false
  embed: null
  show: false
  save_frames: false
  save_txt: false
  save_conf: false
  save_crop: false
  show_labels: true
  show_conf: true
  show_boxes: true
  line_width: null
  keras: false
  optimize: false
  int8: false
  dynamic: false
  simplify: true
  opset: null
  workspace: null
  nms: false
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 0.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  pose: 12.0
  kobj: 1.0
  nbs: 64
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  copy_paste_mode: flip
  auto_augment: randaugment
  erasing: 0.4
  cfg: null
  project: 'runs/cross_validation'

# Hyperparameter Tuning Configuration
hyperparameter_tuning:
  model: "yolov8n-obb.pt"
  data: "./dataset/data.yaml"
  epochs: 1
  iterations: 1
  search_space:
    lr0: [0.00001, 0.1]
    lrf: [0.01, 1.0]
    momentum: [0.6, 0.98]
    weight_decay: [0.0, 0.001]
    warmup_epochs: [0.0, 0.0]
    warmup_momentum: [0.0, 0.95]
    box: [0.02, 0.2]
    cls: [0.2, 4.0]
    hsv_h: [0.0, 0.1]
    hsv_s: [0.0, 0.9]
    hsv_v: [0.0, 0.9]
    degrees: [0.0, 45.0]
    translate: [0.0, 0.9]
    scale: [0.0, 0.9]
    shear: [0.0, 10.0]
    perspective: [0.0, 0.001]
    flipud: [0.0, 1.0]
    fliplr: [0.0, 1.0]
    mosaic: [0.0, 1.0]
    mixup: [0.0, 1.0]
    copy_paste: [0.0, 1.0]

# Benchmark Configuration
benchmark:
  model_path: "./runs/yolov8n_obb_train/weights/best.pt"
  data: "./dataset/data.yaml"
  imgsz: 416
  half: true
  device: 0
  verbose: true
  int8: false
  format: 'onnx'

# Global settings
settings:
  tensorboard: true

# Export configuration
export:
  model_path: "./runs/yolov8n_obb_train/weights/best.pt"
  format: "onnx"
  imgsz: 416
  keras: false
  optimize: false
  half: false
  int8: false
  dynamic: false
  simplify: true
  opset: 14
  workspace: null
  nms: false
  batch: 1
  device: None
  data: "./dataset/data.yaml"
  fraction: 1.0
